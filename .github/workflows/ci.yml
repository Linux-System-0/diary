name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Test
        run: cargo test --locked
      - name: Assert bundled SQLite
        run: |
          cargo tree -i libsqlite3-sys -e features | tee /tmp/sqlite-tree.txt
          grep -q 'feature "bundled"' /tmp/sqlite-tree.txt
      - name: Build release
        run: cargo build --release --locked

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  scratch-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build scratch image
        run: docker build -t diary:ci backend
      - name: Boot in scratch and hit /readyz
        run: |
          mkdir -p /tmp/diary-data
          docker run -d --name diary-ci -p 18787:8787 \
            -v /tmp/diary-data:/data \
            -e DIARY_BIND=0.0.0.0:8787 \
            -e DIARY_DB_PATH=/data/diary.db \
            -e DIARY_JWT_SECRET=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -e DIARY_MASTER_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -e DIARY_CORS_ORIGINS=https://app.example.com \
            diary:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18787/api/v1/readyz; then exit 0; fi
            sleep 1
          done
          docker logs diary-ci
          exit 1
      - name: Cleanup
        if: always()
        run: docker rm -f diary-ci || true
